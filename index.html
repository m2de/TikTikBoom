<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TikTikBoom</title>
  <style>
    body { margin: 0; padding: 0; background: #000; overflow: hidden; touch-action: none; }
    #game { width: 100vw; height: 100vh; }
    canvas { display: block; margin: 0 auto; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script>
    // Game config for mobile portrait
    const config = {
      type: Phaser.AUTO,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 720,
        height: 1280,
        parent: 'game'
      },
      backgroundColor: '#0a0a14',
      scene: [MenuScene, GameScene, GameOverScene],
      physics: { default: 'arcade' },
      audio: { disableWebAudio: false }
    };

    // Shared game state
    let gameState = {
      board: Array(9).fill(null),
      currentPlayer: 'X',
      gameOver: false,
      winner: null,
      isBoom: false,
      playerIsX: true
    };

    const winLines = [
      [0,1,2],[3,4,5],[6,7,8],
      [0,3,6],[1,4,7],[2,5,8],
      [0,4,8],[2,4,6]
    ];

    function getThreats(board, player) {
      const threats = [];
      for (const line of winLines) {
        const marks = line.map(i => board[i]);
        const count = marks.filter(m => m === player).length;
        const empty = marks.filter(m => m === null).length;
        if (count === 2 && empty === 1) {
          threats.push(line[marks.indexOf(null)]);
        }
      }
      return [...new Set(threats)];
    }

    function hasThree(board, player) {
      return winLines.some(line => line.every(i => board[i] === player));
    }

    function aiMove(board) {
      const opponent = 'X';
      const me = 'O';
      const myThreats = getThreats(board, me);
      if (myThreats.length > 0) return myThreats[0];
      const oppThreats = getThreats(board, opponent);
      if (oppThreats.length > 0) return oppThreats[0];
      const prefs = [4, 0, 2, 6, 8, 1, 3, 5, 7];
      for (const p of prefs) {
        if (board[p] === null) return p;
      }
      return board.findIndex(c => c === null);
    }

    class MenuScene extends Phaser.Scene {
      constructor() { super('Menu'); }
      preload() {
        this.load.image('logo', 'assets/logo.jpg');
        this.load.image('bg', 'assets/bg.jpg');
        this.load.image('btn', 'assets/cell.png');
      }
      create() {
        this.add.image(360, 640, 'bg').setDisplaySize(720, 1280).setAlpha(0.6);
        const logo = this.add.image(360, 400, 'logo').setScale(0.45);
        this.tweens.add({ targets: logo, y: 420, duration: 2000, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

        const startBtn = this.add.text(360, 750, 'PLAY vs AI', {
          fontSize: '48px', fontFamily: 'Arial', color: '#ff2d55',
          stroke: '#000', strokeThickness: 6, backgroundColor: '#1a1a2e', padding: { x: 30, y: 15 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        startBtn.on('pointerdown', () => {
          gameState.board = Array(9).fill(null);
          gameState.currentPlayer = 'X';
          gameState.gameOver = false;
          gameState.winner = null;
          gameState.isBoom = false;
          this.scene.start('Game');
        });

        this.add.text(360, 900, 'Miss a block → BOOM!', {
          fontSize: '28px', color: '#ffcc00', align: 'center'
        }).setOrigin(0.5);
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() { super('Game'); }
      preload() {
        this.load.image('bg', 'assets/bg.jpg');
        this.load.image('cell', 'assets/cell.png');
        this.load.image('x', 'assets/x.png');
        this.load.image('o', 'assets/o.png');
        this.load.image('boom', 'assets/boom.png');
      }
      create() {
        this.add.image(360, 640, 'bg').setDisplaySize(720, 1280).setAlpha(0.4);
        this.cells = [];
        this.marks = [];
        const startX = 180, startY = 380, size = 160, gap = 10;

        for (let i = 0; i < 9; i++) {
          const col = i % 3, row = Math.floor(i / 3);
          const x = startX + col * (size + gap);
          const y = startY + row * (size + gap);
          const cell = this.add.image(x, y, 'cell').setDisplaySize(size, size).setInteractive();
          cell.index = i;
          cell.on('pointerdown', () => this.onCellClick(i));
          this.cells.push(cell);
          this.marks.push(null);
        }

        this.statusText = this.add.text(360, 200, "Your turn (X)", {
          fontSize: '40px', color: '#fff', stroke: '#000', strokeThickness: 4
        }).setOrigin(0.5);

        this.cameras.main.setBackgroundColor('#000');
      }

      onCellClick(index) {
        if (gameState.gameOver || gameState.board[index] !== null || gameState.currentPlayer !== 'X') return;
        this.placeMark(index, 'X');
      }

      placeMark(index, player) {
        if (gameState.board[index] !== null) return;
        const opponent = player === 'X' ? 'O' : 'X';
        const oppThreats = getThreats(gameState.board, opponent);

        gameState.board[index] = player;
        const cell = this.cells[index];
        const markKey = player.toLowerCase();
        const mark = this.add.image(cell.x, cell.y, markKey).setDisplaySize(120, 120);
        mark.setScale(0);
        this.tweens.add({ targets: mark, scale: 1, duration: 300, ease: 'Back.easeOut' });
        this.marks[index] = mark;

        if (hasThree(gameState.board, player)) {
          this.endGame(player, false);
          return;
        }

        if (oppThreats.length > 0 && !oppThreats.includes(index)) {
          this.triggerBoom(oppThreats, opponent);
          return;
        }

        if (gameState.board.every(c => c !== null)) {
          this.endGame(null, false);
          return;
        }

        gameState.currentPlayer = opponent;
        this.statusText.setText(player === 'X' ? "AI thinking..." : "Your turn (X)");

        if (opponent === 'O') {
          this.time.delayedCall(600, () => {
            const aiIndex = aiMove(gameState.board);
            if (aiIndex !== -1) this.placeMark(aiIndex, 'O');
          });
        }
      }

      triggerBoom(threatCells, winner) {
        gameState.isBoom = true;
        this.cameras.main.shake(400, 0.02);
        threatCells.forEach(ti => {
          if (gameState.board[ti] === null) {
            const cell = this.cells[ti];
            const boom = this.add.image(cell.x, cell.y, 'boom').setDisplaySize(180, 180);
            boom.setAlpha(0);
            this.tweens.add({ targets: boom, alpha: 1, scale: 1.5, duration: 200, yoyo: true, onComplete: () => boom.destroy() });
            const particles = this.add.particles(cell.x, cell.y, 'boom', {
              speed: { min: 100, max: 300 },
              scale: { start: 0.3, end: 0 },
              lifespan: 600,
              quantity: 8,
              blendMode: 'ADD'
            });
            this.time.delayedCall(800, () => particles.destroy());
          }
        });
        this.endGame(winner, true);
      }

      endGame(winner, isBoom) {
        gameState.gameOver = true;
        gameState.winner = winner;
        gameState.isBoom = isBoom;
        this.time.delayedCall(1000, () => this.scene.start('GameOver'));
      }
    }

    class GameOverScene extends Phaser.Scene {
      constructor() { super('GameOver'); }
      create() {
        this.add.image(360, 640, 'bg').setDisplaySize(720, 1280).setAlpha(0.5);
        let msg = gameState.winner ? (gameState.winner === 'X' ? 'YOU WIN!' : 'AI WINS') : 'DRAW';
        if (gameState.isBoom) msg = (gameState.winner === 'X' ? 'BOOM! YOU WIN!' : 'BOOM! AI WINS');
        this.add.text(360, 500, msg, {
          fontSize: '64px', color: gameState.isBoom ? '#ffcc00' : '#5ac8fa',
          stroke: '#000', strokeThickness: 8, align: 'center'
        }).setOrigin(0.5);

        const again = this.add.text(360, 700, 'PLAY AGAIN', {
          fontSize: '42px', color: '#ff2d55', backgroundColor: '#1a1a2e', padding: { x: 25, y: 12 }
        }).setOrigin(0.5).setInteractive();
        again.on('pointerdown', () => this.scene.start('Menu'));
      }
    }

    const game = new Phaser.Game(config);
  </script>
</body>
</html>
