<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TikTikBoom</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, sans-serif;
    background: #0a0a14;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    touch-action: manipulation;
  }
  h1 {
    font-size: 2.8rem;
    background: linear-gradient(90deg, #ff2d55, #ffcc00);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .status { font-size: 1.3rem; margin: 12px 0; min-height: 1.4em; text-align: center; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 8px;
    background: #1a1a2e;
    padding: 8px;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255,45,85,0.4);
  }
  .cell {
    background: #111122;
    border: 3px solid #ff2d55;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.2rem;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.1s, background 0.15s;
    user-select: none;
  }
  .cell:active { transform: scale(0.95); }
  .cell.x { color: #ff2d55; text-shadow: 0 0 12px #ff2d55; }
  .cell.o { color: #5ac8fa; text-shadow: 0 0 12px #5ac8fa; }
  .cell.boom {
    animation: boom 0.5s ease-out;
    background: #ff4500;
    color: #fff;
  }
  @keyframes boom {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); background: #ffcc00; }
    100% { transform: scale(1); }
  }
  button {
    margin-top: 20px;
    background: #ff2d55;
    color: white;
    border: none;
    padding: 14px 28px;
    font-size: 1.1rem;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .hint { margin-top: 16px; color: #aaa; font-size: 0.9rem; text-align: center; max-width: 320px; }
</style>
</head>
<body>
  <h1>TikTikBoom</h1>
  <div class="status" id="status">Your turn (X)</div>
  <div class="board" id="board"></div>
  <button onclick="reset()">New Game</button>
  <p class="hint">Miss a block and the line explodes. Create forks to force a BOOM!</p>

<script>
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
let board = Array(9).fill(null);
let current = 'X';
let over = false;

const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function getThreats(p) {
  const t = [];
  for (const line of lines) {
    const m = line.map(i => board[i]);
    if (m.filter(x => x === p).length === 2 && m.includes(null)) {
      t.push(line[m.indexOf(null)]);
    }
  }
  return [...new Set(t)];
}
function hasWin(p) {
  return lines.some(l => l.every(i => board[i] === p));
}
function aiMove() {
  const me = 'O', opp = 'X';
  const mine = getThreats(me);
  if (mine.length) return mine[0];
  const theirs = getThreats(opp);
  if (theirs.length) return theirs[0];
  for (const p of [4,0,2,6,8,1,3,5,7]) if (board[p] == null) return p;
  return board.findIndex(c => c == null);
}

function render() {
  boardEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('div');
    c.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
    c.textContent = board[i] || '';
    c.onclick = () => move(i);
    boardEl.appendChild(c);
  }
}

function move(i) {
  if (over || board[i] || current !== 'X') return;
  const opp = 'O';
  const threats = getThreats(opp);
  board[i] = 'X';
  if (hasWin('X')) return end('You win!', false);
  if (threats.length && !threats.includes(i)) return boom(threats, 'O');
  if (board.every(Boolean)) return end('Draw', false);
  current = 'O';
  statusEl.textContent = 'AI thinking...';
  render();
  setTimeout(() => {
    const ai = aiMove();
    if (ai >= 0) {
      const threatsX = getThreats('X');
      board[ai] = 'O';
      if (hasWin('O')) return end('AI wins', false);
      if (threatsX.length && !threatsX.includes(ai)) return boom(threatsX, 'X');
      if (board.every(Boolean)) return end('Draw', false);
      current = 'X';
      statusEl.textContent = 'Your turn (X)';
    }
    render();
  }, 500);
}

function boom(cells, winner) {
  over = true;
  cells.forEach(i => {
    const el = boardEl.children[i];
    if (el) { el.classList.add('boom'); el.textContent = '💥'; }
  });
  statusEl.textContent = winner === 'X' ? 'BOOM! You win!' : 'BOOM! AI wins';
  statusEl.style.color = '#ffcc00';
  if (navigator.vibrate) navigator.vibrate(200);
}

function end(msg, isBoom) {
  over = true;
  statusEl.textContent = msg;
  statusEl.style.color = isBoom ? '#ffcc00' : '#5ac8fa';
}

function reset() {
  board = Array(9).fill(null);
  current = 'X';
  over = false;
  statusEl.textContent = 'Your turn (X)';
  statusEl.style.color = '#fff';
  render();
}
reset();
</script>
</body>
</html>
